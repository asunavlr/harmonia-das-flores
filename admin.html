<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel · Harmonia das Flores</title>
<meta name="theme-color" content="#1d3328">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f8f2ea;--paper:#fffaf4;--ink:#1d3328;--ink-2:#45594d;--muted:#7d8a80;--rose:#c4506a;--blush:#f5dfe1;--line:rgba(29,51,40,.12);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Manrope,system-ui,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1{font-family:"Cormorant Garamond";font-size:32px;line-height:1.1}
h1 em{color:var(--rose)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:999px;font-weight:600;font-size:15px}
.btn-ink{background:var(--ink);color:var(--cream)}
.btn-rose{background:var(--rose);color:#fff}
.btn-ghost{border:1px solid var(--line);background:var(--paper)}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .box{width:100%;max-width:360px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px 24px;text-align:center}
.login p{color:var(--muted);font-size:14px;margin:8px 0 18px}
.login .btn{width:100%;margin-top:12px}
.err{color:var(--rose);font-size:14px;margin-top:10px;min-height:20px}

/* topo */
header{position:sticky;top:0;z-index:5;background:rgba(248,242,234,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
header small{display:block;color:var(--muted);font-size:13px}
.bar{display:flex;gap:10px;margin:20px 0}
.bar .btn{flex:1}

/* filtros */
.filters{display:grid;gap:10px;margin-bottom:16px}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:600}
.fchips button.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.fchips small{opacity:.6;margin-left:4px}
/* lista */
.list{display:grid;gap:12px;padding-bottom:120px}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.item img{width:76px;height:92px;object-fit:cover;border-radius:12px;background:var(--blush)}
.item h3{font-size:16px;line-height:1.2}
.item .meta{font-size:13px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;background:var(--rose);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.acts{display:flex;flex-direction:column;gap:4px}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;font-size:16px}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* salvar */
.save{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:12px;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:10}
.save.show{transform:none}
.save span{font-size:14px}

/* formulário */
dialog{border:0;border-radius:24px 24px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;max-height:92vh;background:var(--paper)}
dialog::backdrop{background:rgba(29,51,40,.5)}
@media (min-width:640px){dialog{border-radius:24px;margin:auto}}
.form{padding:22px 20px 24px}
.form h2{font-family:"Cormorant Garamond";font-size:28px}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pic{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--blush)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .cover{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
.pic .x{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);font-size:14px;line-height:26px;text-align:center}
.pic .mv{position:absolute;left:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.95);font-size:13px}
.addpic{aspect-ratio:4/5;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;background:#fff;cursor:pointer;padding:6px}
.addpic b{display:block;font-size:24px;color:var(--rose);font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money input{padding-left:42px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--rose)}
.form .row{display:flex;gap:10px;margin-top:22px}
.form .row .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-150%);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .35s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="login" id="login">
  <form class="box" id="loginForm">
    <h1>Harmonia <em>das Flores</em></h1>
    <p>Painel do catálogo</p>
    <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" required>
    <button class="btn btn-ink">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div><h1 style="font-size:24px">Catálogo</h1><small id="count"></small></div>
      <a class="btn btn-ghost" href="/" target="_blank" style="padding:10px 16px;font-size:14px">Ver site ↗</a>
    </div>
  </header>
  <main class="wrap">
    <div class="bar"><button class="btn btn-rose" id="add">＋ Adicionar flor</button></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar pelo nome…">
      <div class="fchips" id="fchips"></div>
    </div>
    <div class="list" id="list"></div>
  </main>
  <div class="save" id="saveBar">
    <span id="saveMsg">Alterações não salvas</span>
    <button class="btn btn-rose" id="save">Publicar no site</button>
  </div>
</div>

<dialog id="dlg">
  <form class="form" id="form" method="dialog">
    <h2 id="formTitle">Nova flor</h2>
    <div class="pics" id="pics"></div>
    <div class="hint">Até 6 fotos: buquê, detalhe, arranjo pronto… A primeira é a capa.</div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <label for="fn">Nome</label>
    <input id="fn" required placeholder="Ex.: Buquê de Rosas Cor-de-rosa">
    <label for="fd">Descrição</label>
    <textarea id="fd" placeholder="Ex.: 12 rosas com eucalipto e papel kraft."></textarea>
    <div class="two">
      <div>
        <label for="fc">Categoria</label>
        <select id="fc">
          <option value="rosas">Rosas</option>
          <option value="girassois">Girassóis</option>
          <option value="campo">Flores do campo</option>
          <option value="gerberas">Gérberas</option>
          <option value="lirios">Lírios</option>
          <option value="orquideas">Orquídeas</option>
          <option value="cestas">Cestas</option>
          <option value="presentes">Presentes</option>
        </select>
      </div>
      <div>
        <label for="fprazo">Disponibilidade</label>
        <select id="fprazo">
          <option value="">Sob encomenda</option>
          <option>Pronta entrega</option>
          <option>Encomendar com 1 dia</option>
          <option>Encomendar com 2 dias</option>
        </select>
      </div>
    </div>
    <label for="fflores">O que vem (flores e itens)</label>
    <input id="fflores" placeholder="Ex.: 12 rosas, eucalipto, papel kraft e laço">
    <div class="two">
      <div>
        <label for="ftam">Tamanho</label>
        <input id="ftam" placeholder="Ex.: Médio · 45 cm">
      </div>
      <div>
        <label for="fdura">Dura quanto tempo</label>
        <input id="fdura" placeholder="Ex.: 5 a 7 dias">
      </div>
    </div>
    <label for="fcores">Cores disponíveis</label>
    <input id="fcores" placeholder="Ex.: Vermelho, Rosa, Branco">
    <div class="hint">Separe por vírgula. O cliente escolhe a cor no site.</div>
    <label for="fextras">Pode adicionar</label>
    <input id="fextras" placeholder="Ex.: Chocolate, Pelúcia, Cartão, Balão">
    <div class="hint">Separe por vírgula. O cliente marca o que quer junto.</div>
    <label for="fcuid">Cuidados (opcional)</label>
    <input id="fcuid" placeholder="Ex.: Trocar a água a cada 2 dias">
    <label for="ft">Etiqueta (opcional)</label>
    <input id="ft" placeholder="Ex.: Mais pedido">
    <label class="check"><input type="checkbox" id="fnovo"> Mostrar como Novidade</label>
    <div class="row">
      <button class="btn btn-ghost" type="button" id="cancel">Cancelar</button>
      <button class="btn btn-ink" type="submit">Pronto</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const CAT = {rosas: "Rosas", girassois: "Girassóis", campo: "Flores do campo", gerberas: "Gérberas", lirios: "Lírios", orquideas: "Orquídeas", cestas: "Cestas", presentes: "Presentes"};
let pw = "";
let items = [];
let uploads = {}; // caminho -> base64
let previews = {}; // caminho -> dataURL para mostrar antes de publicar
let editing = -1;
let photos = []; // caminhos (img/...) ou dataURL das novas

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }
function dirty(on = true) { $("saveBar").classList.toggle("show", on); }

async function api(method, body) {
  const r = await fetch("/api/save", { method, headers: { "Content-Type": "application/json", "x-admin-password": pw }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Erro " + r.status);
  return data;
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  pw = $("pw").value;
  $("loginErr").textContent = "";
  try {
    await api("GET");
    try { sessionStorage.setItem("hpw", pw); } catch {}
    start();
  } catch (err) { $("loginErr").textContent = err.message; }
});

async function start() {
  $("login").hidden = true;
  $("app").hidden = false;
  items = await fetch("/catalogo.json?t=" + Date.now()).then((r) => r.json());
  render();
}

const csv = (id) => $(id).value.split(",").map((v) => v.trim()).filter(Boolean);
const list = (it) => (it.imgs && it.imgs.length ? it.imgs : [it.img]).filter(Boolean);
const cover = (it) => list(it)[0];
const src = (p) => p.startsWith("data:") ? p : previews[p] || "/" + p;
function renderPics() {
  $("pics").innerHTML = photos.map((p, k) => `
    <div class="pic"><img src="${esc(src(p))}" alt="">${k ? `<button type="button" class="mv" data-k="${k}" title="Virar capa">★</button>` : '<span class="cover">CAPA</span>'}
      <button type="button" class="x" data-k="${k}" title="Remover">✕</button></div>`).join("")
    + (photos.length < 6 ? `<label class="addpic" for="file"><span><b>＋</b>${photos.length ? "Mais fotos" : "Adicionar fotos"}</span></label>` : "");
}
$("pics").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const k = +b.dataset.k;
  if (b.classList.contains("x")) photos.splice(k, 1);
  else photos.unshift(...photos.splice(k, 1));
  renderPics();
});
let fcat = "", fq = "", limit = 40;
$("q").addEventListener("input", (e) => { fq = e.target.value.trim().toLowerCase(); limit = 40; render(); });
$("fchips").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; fcat = b.dataset.c; limit = 40; render(); });
$("list").addEventListener("click", (e) => { if (e.target.id === "more") { limit += 40; render(); } });
function render() {
  $("count").textContent = `${items.length} ${items.length === 1 ? "item" : "itens"} no site`;
  const counts = {}; items.forEach((it) => (counts[it.c] = (counts[it.c] || 0) + 1));
  $("fchips").innerHTML = [["", "Todos", items.length], ...Object.entries(CAT).map(([k, v]) => [k, v, counts[k] || 0])]
    .map(([k, v, n]) => `<button data-c="${k}" class="${fcat === k ? "on" : ""}">${v}<small>${n}</small></button>`).join("");
  const vis = items.map((it, i) => [it, i]).filter(([it]) => (!fcat || it.c === fcat) && (!fq || it.n.toLowerCase().includes(fq)));
  $("list").innerHTML = vis.length ? vis.slice(0, limit).map(([it, i]) => `
    <div class="item">
      <img src="${esc(src(cover(it)))}" alt="">
      <div>
        <h3>${esc(it.n)}${it.novo ? '<span class="badge">Novidade</span>' : ""}</h3>
        <div class="meta">${CAT[it.c] || it.c}${it.prazo ? " · " + esc(it.prazo) : ""} · ${list(it).length} foto${list(it).length > 1 ? "s" : ""}</div>
      </div>
      <div class="acts">
        <button class="ico" data-a="edit" data-i="${i}" title="Editar">✎</button>
        <button class="ico" data-a="up" data-i="${i}" title="Subir" ${i ? "" : "disabled"}>↑</button>
        <button class="ico" data-a="del" data-i="${i}" title="Apagar">🗑</button>
      </div>
    </div>`).join("") + (vis.length > limit ? `<button class="btn btn-ghost" id="more" style="width:100%">Mostrar mais (${vis.length - limit})</button>` : "") : '<div class="empty">Nada encontrado.</div>';
}

$("list").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const i = +b.dataset.i;
  if (b.dataset.a === "edit") openForm(i);
  if (b.dataset.a === "up" && i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; render(); dirty(); }
  if (b.dataset.a === "del" && confirm(`Apagar "${items[i].n}" do catálogo?`)) { items.splice(i, 1); render(); dirty(); }
});

function openForm(i) {
  editing = i;
  const it = items[i] || { n: "", d: "", c: fcat || "rosas", p: "", t: "", novo: true };
  $("formTitle").textContent = i < 0 ? "Nova flor" : "Editar flor";
  $("fn").value = it.n; $("fd").value = it.d; $("fc").value = it.c; $("fprazo").value = it.prazo || ""; $("fflores").value = it.flores || ""; $("ftam").value = it.tam || ""; $("fdura").value = it.dura || ""; $("fcores").value = (it.cores || []).join(", "); $("fextras").value = (it.extras || []).join(", "); $("fcuid").value = it.cuid || ""; $("ft").value = it.t || ""; $("fnovo").checked = !!it.novo;
  photos = i < 0 ? [] : list(it).slice();
  renderPics();
  $("file").value = "";
  $("dlg").showModal();
}
$("add").addEventListener("click", () => openForm(-1));
$("cancel").addEventListener("click", () => $("dlg").close());

// Reduz a foto no celular antes de subir (máx. 1200px, JPEG ~80%).
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => reject(new Error("Não consegui abrir essa foto"));
    img.src = URL.createObjectURL(file);
  });
}

$("file").addEventListener("change", async () => {
  for (const f of [...$("file").files].slice(0, 6 - photos.length)) {
    try { photos.push(await compress(f)); } catch (err) { toast(err.message); }
  }
  $("file").value = "";
  renderPics();
});

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const cur = items[editing];
  if (!photos.length) { toast("Coloque pelo menos uma foto"); return; }
  const n = $("fn").value.trim();
  const id = cur?.id || n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-" + Date.now().toString(36);
  const imgs = photos.map((p, k) => {
    if (!p.startsWith("data:")) return p;
    const path = `img/cat/${id}-${Date.now().toString(36)}${k}.jpg`;
    uploads[path] = p.split(",")[1];
    previews[path] = p;
    return path;
  });
  const it = { id, n, d: $("fd").value.trim(), c: $("fc").value, img: imgs[0], imgs, t: $("ft").value.trim(), prazo: $("fprazo").value, flores: $("fflores").value.trim(), tam: $("ftam").value.trim(), dura: $("fdura").value.trim(), cores: csv("fcores"), extras: csv("fextras"), cuid: $("fcuid").value.trim(), novo: $("fnovo").checked };
  if (cur) items[editing] = it; else items.unshift(it);
  $("dlg").close(); render(); dirty();
});

$("save").addEventListener("click", async () => {
  const b = $("save"); b.disabled = true; $("saveMsg").textContent = "Publicando…";
  try {
    const used = new Set(items.flatMap(list));
    const files = Object.entries(uploads).filter(([p]) => used.has(p)).map(([path, data]) => ({ path, data }));
    await api("POST", { items, uploads: files });
    uploads = {};
    dirty(false);
    toast("Publicado! Aparece no site em ~1 minuto 🌷");
  } catch (err) {
    $("saveMsg").textContent = "Não salvou: " + err.message;
  } finally { b.disabled = false; }
});

window.addEventListener("beforeunload", (e) => { if ($("saveBar").classList.contains("show")) e.preventDefault(); });

try { const saved = sessionStorage.getItem("hpw"); if (saved) { pw = saved; api("GET").then(start).catch(() => {}); } } catch {}
</script>
</body>
</html>
